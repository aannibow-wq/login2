<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Application Portal</title>

  <!-- Font Awesome (icons) + Inter (font) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!--  HEADER  -->
  <header class="brand">
    <div class="logo">
      <!-- Replace with your own logo file -->
      <img src="C:\Users\Alma Tech PC\Pictures\login2\must_logo.png" alt="University logo">
    </div>
    <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
    <span class="badge">Online Application Portal</span>
  </header>

  <!--  LOGIN CARD  -->
  <main class="card">
    <h2>Welcome Back</h2>
    <p class="sub">Log in to access your application dashboard</p>

    <!-- Backend: point action to your login handler (e.g. login.php) -->
    <form id="loginForm" action="login.php" method="post">
      <div class="field">
        <label for="loginEmail">Email Address</label>
        <div class="input-group">
          <span class="icon"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" id="loginEmail" name="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="input-group">
          <span class="icon"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <a href="forgot-password.html" class="forgot">
      <i class="fa-solid fa-key"></i> Forgot your password?
    </a>

    <div class="divider"><span>New to the portal?</span></div>

    <div class="actions">
      <a href="create-account.html" class="btn btn-outline-blue">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </a>
      <a href="how-to-apply.html" class="btn btn-outline-dark">
        <i class="fa-solid fa-circle-question"></i> How to Apply
      </a>
    </div>
  </main>

</body>
</html>
